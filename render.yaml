services:
  - type: web
    name: ielts-hermes-backup
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /opt/hermes
      - key: IELTS_BACKUP_KEY
        sync: false
      - key: BACKUP_MODEL_BASE_URL
        sync: false
      - key: BACKUP_MODEL
        sync: false
      - key: BACKUP_MODEL_KEY
        sync: false
